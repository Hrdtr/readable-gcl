version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - readablegcl
  settings:
    custom:
      readablegcl:
        type: "module"
        description: "Readable Go naming conventions and test clarity"
        settings:
          preset: "pragmatic"
          naming_clarity:
            enabled: true
            single_letter_args: true
            banned_suffixes:
              - "Boolean"
              - "Bool"
              - "Str"
              - "Int"
            bad_initialisms:
              Id: "ID"
              Url: "URL"
              Ttl: "TTL"
              Jwt: "JWT"
              Sid: "SID"
            banned_words:
              - "cfg"
              - "mgr"
              - "req"
              - "res"
              - "resp"
              - "val"
              - "vals"
              - "obj"
              - "usr"
            type_rules:
              "context.Context":
                canonical_name: "ctx"
                expected_tail: "Ctx"
              "error":
                canonical_name: "err"
                expected_tail: "Err"
            exempt_identifiers:
              - "_"
              - "ok"
              - "t"

          test_convention:
            enabled: true
            enforce_table_subtests: true
